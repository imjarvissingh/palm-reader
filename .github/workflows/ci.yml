name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component tests
        run: npm run test:ci
      - name: Bundle Android and iOS (Hermes)
        run: npx expo export --platform android --platform ios --output-dir dist-check
      # Known high/moderate advisories are in Expo CLI, metro and jest tooling with
      # no patched release yet (see replica/security.md); fail only on critical.
      - name: Audit dependencies (fail on critical)
        run: npm audit --omit=dev --audit-level=critical
